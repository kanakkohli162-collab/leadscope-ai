# Used ONLY by tests (src/test/resources wins over src/main/resources while testing).
# Tests run against H2, a throwaway in-memory database, so they need neither MySQL
# nor application-secret.properties.
spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:leadscope;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.web.error.include-message=always

# Dummy values for tests only - the real ones live in application-secret.properties
jwt.secret=test-only-secret-key-not-used-anywhere-real-1234567890
jwt.expiration-ms=3600000
