spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties
spring.datasource.url=jdbc:mysql://localhost:3306/leadscope
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Put our error text ("Incorrect password...") in the JSON error body so the frontend can show it.
# Spring Boot 4 renamed this from server.error.include-message
spring.web.error.include-message=always