spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leadscope}
spring.datasource.username=${DB_USER:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.web.error.include-message=always

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt.secret=${JWT_SECRET:change-me-local-only-change-me-local-only-1234}
jwt.expiration-ms=${JWT_EXPIRATIONMS:86400000}
google.places.key=${GOOGLE_PLACES_KEY:}
gemini.key=${GEMINI_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}